name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 Google 已下架 tools 包，会直接报 "Failed to find package 'tools'"。
      # GitHub 的 ubuntu runner 本身预装了 Android SDK，直接用它。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/* 2>/dev/null | sort -V | tail -1)"
          echo "SDK     : $SDK"
          echo "cmdline : $CMDLINE"
          export PATH="$CMDLINE/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      # 走 Makefile，保证 CI 与本地是同一条构建路径
      - name: 构建
        run: make build

      - name: 生成校验和
        run: cd build && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: memclean-apk
          path: |
            build/memclean-*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
